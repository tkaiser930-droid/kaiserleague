services:
  - type: web
    name: kaiser-family-fantasy-smx
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPOSITORY
        value: tkaiser930-droid/LeagueSave
      - key: GITHUB_BACKUP_PASSWORD
        sync: false
      - key: GITHUB_BRANCH
        value: ""
      - key: GITHUB_DATA_PATH
        value: league-data/league-data.json
