services:
  - type: web
    name: kaiser-family-fantasy-smx
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPOSITORY
        sync: false
      - key: GITHUB_BACKUP_PASSWORD
        sync: false
      - key: GITHUB_BRANCH
        value: main
      - key: GITHUB_DATA_PATH
        value: league-data/league-data.json
      - key: GITHUB_AUTO_BACKUP
        value: "true"
    disk:
      name: kaiser-family-fantasy-smx-data
      mountPath: /var/data
      sizeGB: 1
