<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
<title id="title">Antalya provincial governorate flag</title>
<desc id="desc">White flag field with a simplified rendering of the Antalya Governorate seal: a dark navy circular border, Turkish flag, and orange fruit motif with blue and green leaves.</desc>
<rect width="600" height="400" fill="#fff"/>
<g transform="translate(300 201)">
  <circle r="159" fill="#211d5e"/>
  <circle r="145" fill="#fff"/>
  <circle r="130" fill="none" stroke="#211d5e" stroke-width="7"/>
  <!-- Turkish flag at the crown of the governorate seal -->
  <path d="M-35 -166 H35 V-124 H-35 Z" fill="#e30a17" stroke="#fff" stroke-width="2"/>
  <circle cx="-11" cy="-145" r="10" fill="#fff"/>
  <circle cx="-7" cy="-148" r="8" fill="#e30a17"/>
  <path d="M10 -155 L13 -148 L21 -148 L15 -143 L17 -135 L10 -140 L3 -135 L5 -143 L-1 -148 L7 -148 Z" fill="#fff"/>
  <text x="0" y="-91" text-anchor="middle" fill="#171717" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="1.1">T.C. ANTALYA VALİLİĞİ</text>
  <g transform="translate(0 18) scale(.77)">
    <!-- Blue and green leaves -->
    <path d="M-22 -5 C-68 -52 -113 -35 -99 -6 C-75 20 -45 13 -22 -5Z" fill="#168bc0"/>
    <path d="M-2 -22 C-8 -78 20 -104 39 -85 C48 -54 23 -34 -2 -22Z" fill="#94c11f"/>
    <!-- Orange spiral/citrus emblem -->
    <path d="M4 -5 C45 -34 91 1 88 48 C85 95 35 116 -20 102 C-74 87 -103 34 -75 -13 C-51 -54 3 -69 44 -40 C75 -18 72 18 48 35 C27 50 5 41 1 22 C-2 7 12 -4 25 3 C35 8 31 22 21 24 C48 18 48 -12 25 -24 C-5 -40 -43 -18 -51 14 C-61 55 -23 86 17 84 C62 82 80 41 63 7 C50 -19 23 -29 4 -5Z" fill="#f58213"/>
  </g>
</g>
</svg>